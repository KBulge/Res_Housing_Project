name: Residential Housing Data Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true/false)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  data-pipeline:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # Set up Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Ingest Parcllabs data and load Bronze
      # --------------------------------------------------------
      - name: Ingest and Load Bronze
        run: python -m src.snowflake.load_bronze
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PARCLLABS_API_KEY: ${{ secrets.PARCLLABS_API_KEY }}

      # --------------------------------------------------------
      # Quarantine invalid Silver records
      # --------------------------------------------------------
      - name: Quarantine Silver records
        if: ${{ inputs.dry_run == false }}
        run: python -m src.snowflake.run_sql src/validation/quarantine_silver.sql

      # --------------------------------------------------------
      # Validate Silver
      # --------------------------------------------------------
      - name: Validate Silver
        if: ${{ inputs.dry_run == false }}
        run: python -m src.validation.validate_silver

      # --------------------------------------------------------
      # Load Silver
      # --------------------------------------------------------
      - name: Load Silver
        if: ${{ inputs.dry_run == false }}      
        run: python -m src.snowflake.run_sql src/snowflake/load_silver.sql

      # --------------------------------------------------------
      # Validate Gold candidate
      # --------------------------------------------------------
      - name: Validate Gold candidate
        if: ${{ inputs.dry_run == false }}      
        run: python -m src.validation.validate_gold

      # --------------------------------------------------------
      # Build Gold
      # --------------------------------------------------------
      - name: Build Gold
        if: ${{ inputs.dry_run == false }}
        run: python -m src.snowflake.run_sql src/snowflake/build_gold.sql